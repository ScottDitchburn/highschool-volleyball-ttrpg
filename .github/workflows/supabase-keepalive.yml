# Keeps the free-tier Supabase project from auto-pausing after 7 days of
# inactivity (a paused project takes Discord sign-in and cloud lookups down).
#
# Runs a real database query through PostgREST against the public_characters
# view using the publishable key from .env.production. That key is public by
# design (RLS-gated), so no repository secrets are needed.
#
# Note: GitHub disables scheduled workflows after 60 days without repository
# activity; re-enable it from the Actions tab if that happens.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 3 * * *' # daily, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .env.production
          sparse-checkout-cone-mode: false

      - name: Query Supabase
        run: |
          set -euo pipefail
          url=$(grep -E '^VITE_SUPABASE_URL=' .env.production | cut -d= -f2- | tr -d '[:space:]')
          key=$(grep -E '^VITE_SUPABASE_PUBLISHABLE_KEY=' .env.production | cut -d= -f2- | tr -d '[:space:]')
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "::error::Supabase URL or publishable key missing from .env.production"
            exit 1
          fi
          status=$(curl -sS -o /tmp/body.json -w '%{http_code}' \
            --retry 3 --retry-delay 10 \
            -H "apikey: $key" \
            -H "Authorization: Bearer $key" \
            "$url/rest/v1/public_characters?select=id&limit=1")
          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            cat /tmp/body.json || true
            echo "::error::Supabase keep-alive query failed (HTTP $status). The project may be paused — restore it from the Supabase dashboard."
            exit 1
          fi
